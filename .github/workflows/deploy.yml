# Push to main, and the running service becomes this commit.
#
# There is no service account key anywhere in this file or in the repository's
# secrets. GitHub proves who it is with a short lived OIDC token, Google checks
# that the token names this repository, and only then hands back a credential
# that lasts minutes. A key in a secret would outlive the job, the laptop and
# the person who made it; this cannot be copied out and reused.
#
# The deploy identity is migragent-deployer. It can build an image and move a
# Cloud Run revision. It cannot read Firestore, so it cannot see a case or a
# document, and it cannot become the watcher.
#
# THIS DEPLOYS THE SERVICE AND NOT THE INGEST JOB, ON PURPOSE.
# `migragent-ingest` runs as the watcher, and updating a job whose template names
# a service account needs iam.serviceAccounts.actAs on that account. Granting the
# deploy identity actAs on the watcher would mean a workflow run could become the
# watcher, which is the one thing Decision 5 says nothing can do and
# tools/test_isolation.py measures. So the job is deployed by hand:
#
#   gcloud run jobs deploy migragent-ingest --source . --region us-central1 #     --project PROJECT --service-account migragent-watcher@PROJECT.iam.gserviceaccount.com
#
# Which means a green run here does NOT mean the pipeline is on this commit. That
# gap has already cost something once: see D38.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT: project-e0928f2f-5abf-46a3-b8a
  REGION: us-central1
  SERVICE: migragent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: project-e0928f2f-5abf-46a3-b8a
          workload_identity_provider: projects/158351874494/locations/global/workloadIdentityPools/github/providers/migragent
          service_account: migragent-deployer@project-e0928f2f-5abf-46a3-b8a.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$REGION" \
            --service-account "migragent-web@$PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --timeout 900 \
            --quiet

      # A deploy that reports success while the service returns 500 is a deploy
      # that lies. The job fails unless the new revision answers.
      #
      # /health is a static string and proves only that the container booted.
      # It stayed 200 through the whole %28default%29 outage while every page
      # that touches Firestore was 500ing. So one route that reads the store is
      # checked here too, and it is the landing page because that is the first
      # thing anybody sees.
      - name: Check the service answers
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" \
                  --region "$REGION" --format='value(status.url)')
          for path in /health /; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$path")
            echo "$url$path -> $code"
            test "$code" = "200"
          done
