<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An SVG favicon can answer the browser theme, which a .ico cannot. Deep
       green on warm paper by day, raised green on near black by night. -->
  <style>
    .bg { fill: #FCFAF6 }
    .fg { fill: none; stroke: #0B6E4F }
    .dot { fill: #0B6E4F }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B0D10 }
      .fg { stroke: #3DD68C }
      .dot { fill: #3DD68C }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <path class="fg" d="M15 42 V15 L32 32 L49 15 V42"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" cx="32" cy="52" r="4.5"/>
</svg>
