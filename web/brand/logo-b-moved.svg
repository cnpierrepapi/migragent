<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MIGRAGENT">
  <title>MIGRAGENT, the moved line</title>
  <!-- Three lines of a rule, and the bottom one has shifted. It is a diff, and
       it means the only thing a competitor cannot copy: the requirement moved
       and we caught the day it moved.
       This is the mark for the country watch screen rather than for the guide. -->
  <rect x="11" y="15" width="42" height="8" rx="4" fill="currentColor"/>
  <rect x="11" y="28" width="26" height="8" rx="4" fill="currentColor"/>
  <rect x="25" y="41" width="28" height="8" rx="4" fill="currentColor" opacity=".55"/>
</svg>
