<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MIGRAGENT">
  <title>MIGRAGENT, the stamp</title>
  <!-- An entry stamp, slightly off square because a stamp never lands
       straight. The chevron is the crossing. Warmest of the three and the
       most literal, which is the risk: every visa brand on earth owns a
       stamp. -->
  <g transform="rotate(-7 32 32)">
    <rect x="7" y="7" width="50" height="50" rx="11"
          fill="none" stroke="currentColor" stroke-width="6"/>
    <path d="M25 21 L39 32 L25 43"
          fill="none" stroke="currentColor" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
