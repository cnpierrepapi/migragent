<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MIGRAGENT">
  <title>MIGRAGENT, the hollow seal</title>
  <!-- The milled edge of an official seal, with nothing in the middle. It says
       the source is official, and the empty centre says we are not the ones
       issuing it and will never wear anybody's crest.
       Riskiest of the three at small sizes because a dashed ring fills in. -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="currentColor" stroke-width="6"
          stroke-dasharray="3.5 5.58" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="currentColor" stroke-width="6"/>
</svg>
